[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slackshare"
version = "0.1.0"
description = "Input-oriented FDH slack analysis for a single (undesirable) input, with aggregate decomposition across DMUs. Supports panel data (multi-date, multi-input-type) via analyze_panel."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
]

[project.optional-dependencies]
example = ["plotly>=5.9.0"]

[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.6", "scipy>=1.8"]

[tool.setuptools.packages.find]
include = ["slackshare*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]
